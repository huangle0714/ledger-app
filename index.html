<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#233a5b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>开发系统</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="stylesheet" href="./styles.css?v=20260823b" />
<link rel="stylesheet" href="./pwa-overrides.css?v=20260823b" />
</head>
<body>

<section class="auth-screen show" id="authScreen">
<div class="auth-logo">💳</div>
<h1>开发系统</h1>
<div class="auth-card">
<label>密码</label>
<input id="authInput" type="password" placeholder="输入密码" autocomplete="current-password" />
<button class="auth-btn" onclick="tryLogin()">登录</button>
<div class="auth-err" id="authErr"></div>
</div>
<p class="auth-note">数据仅保存在本机浏览器,不上传服务器。可在设置中一键备份到你的 GitHub 私有仓库。</p>
</section>

<main class="phone-shell" id="appShell" style="display:none">
<header class="topbar"><div><p class="eyebrow">开发系统管理</p><h1 id="pageTitle">总览</h1></div><button class="topbar-search" onclick="openQuery()" title="流水查询">🔍</button></header>

<section class="page active" data-page="home">
<div class="hero-summary">
<div class="summary-heading"><span>账户总览</span><button class="icon-button" onclick="renderAll()">↻</button></div>
<div class="hero-number" id="heroTotal">¥0<span class="hero-unit">总额度</span></div>
<div class="usage-track"><span id="heroBar" style="width:0%"></span></div>
<div class="usage-meta"><span id="heroUsed">已用 ¥0</span><strong id="heroPct">0%</strong></div>
<div class="summary-grid"><div><span>固定额度</span><strong id="heroFixed">¥0</strong></div><div><span>临时额度</span><strong id="heroTemp">¥0</strong></div><div><span>可用额度</span><strong id="heroAvail">¥0</strong></div></div>
</div>
<div class="section-heading cards-heading"><div><p class="eyebrow">已绑定账户</p><h2>我的卡片</h2></div></div>
<div class="card-list" id="homeCards"></div>
</section>

<section class="page" data-page="cards">
<div class="cards-count"><span id="cardsCount">0 张卡片</span><button class="sort-trigger" onclick="openSort()">排序:<span id="sortName">还款日</span> ⌄</button></div>
<div class="card-list" id="allCards"></div>
</section>

<section class="page" data-page="repayment">
<div class="repayment-header"><div><p class="eyebrow" id="calMonthLabel">2026 年 8 月</p><h2>还款日历</h2></div><button class="month-button" onclick="toToday()">回今天</button></div>
<div class="calendar-strip" id="calStrip"></div>
<div class="cal-legend"><span><i class="d-due"></i>还款日</span><span><i class="d-bill"></i>账单日</span></div>
<div class="flow-head"><h3>当日流水</h3><span class="flow-day" id="flowDay"></span></div>
<div class="flow-list" id="dayFlow"></div>
</section>

<section class="page" data-page="settings">
<div class="settings-group"><p class="eyebrow">数据备份</p>
<button class="setting-row" onclick="openSync()"><span class="setting-icon green">☁</span><span>备份与同步</span><b id="syncTime">未同步</b><span class="chevron">›</span></button>
<button class="setting-row" onclick="openBackupCfg()"><span class="setting-icon blue">⚙</span><span>备份设置(GitHub 仓库 / 令牌)</span><span class="chevron">›</span></button>
<button class="setting-row" onclick="openExport()"><span class="setting-icon purple">⇩</span><span>导出 .db 备份文件</span><span class="chevron">›</span></button>
<button class="setting-row" onclick="openImport()"><span class="setting-icon orange">⇧</span><span>导入 .db（含 xyk 数据）</span><span class="chevron">›</span></button>
</div>
<div class="settings-group"><p class="eyebrow">安全</p>
<button class="setting-row" onclick="openPwd()"><span class="setting-icon green">🔑</span><span>修改密码</span><span class="chevron">›</span></button>
<button class="setting-row" onclick="lockApp()"><span class="setting-icon red">⎋</span><span>锁定 / 退出</span><span class="chevron">›</span></button>
</div>
<div class="settings-group"><p class="eyebrow">卡片管理</p>
<button class="setting-row" onclick="openAdd()"><span class="setting-icon blue">＋</span><span>添加卡片</span><span class="chevron">›</span></button>
<button class="setting-row" onclick="openEditPick()"><span class="setting-icon orange">✎</span><span>修改卡片</span><span class="chevron">›</span></button>
<button class="setting-row" onclick="openManage()"><span class="setting-icon red">🗑</span><span>删除卡片</span><span class="chevron">›</span></button>
</div>
</section>

<nav class="bottom-nav">
<button class="nav-item active" onclick="go('home')"><span>⌂</span><small>总览</small></button>
<button class="nav-item" onclick="go('cards')"><span>▦</span><small>卡片</small></button>
<button class="nav-item" onclick="go('repayment')"><span>✓</span><small>还款</small></button>
<button class="nav-item" onclick="go('settings')"><span>⚙</span><small>设置</small></button>
</nav>
</main>

<div class="modal-backdrop" id="mb"><div class="modal"><div class="modal-handle"></div><div class="modal-header"><h2 id="mTitle">卡片详情</h2><button class="close-button" onclick="closeM()">×</button></div><div id="mBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="./vendor/sql-wasm.js"></script>
<script src="./seed-data.js"></script>
<script src="./app.js?v=20260823b"></script>
<script>
// 已切换为普通联网网页：不再注册 Service Worker，也不依赖离线缓存。
// 清理手机上旧版本留下的 Service Worker 和 Cache Storage，避免继续显示旧页面。
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration => registration.unregister()));
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
      }
    } catch (error) {
      console.warn('清理旧离线缓存失败', error);
    }
  });
}
</script>
</body>
</html>
